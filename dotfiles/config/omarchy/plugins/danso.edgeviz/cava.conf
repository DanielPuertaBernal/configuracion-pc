[general]
framerate = 60
bars = 32
autosens = 0
# Fixed gain so bar height tracks real loudness (Spotify/system volume).
sensitivity = 300

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 15
