host = 172.16.11.108
port = 24800
name = danso
backend = uinput
# Windows sends raw scancodes (= evdev); waynergy works in xkb codes (evdev + 8)
xkb_key_offset = 8

[tls]
enable = false

# Windows extended keys (E0 prefix) arrive as scancode | 0x100.
# Values are absolute xkb keycodes (evdev + 8).
[raw-keymap]
offset_on_explicit = false
# Right Ctrl, AltGr, Super L/R, Menu
285 = 105
312 = 108
347 = 133
348 = 134
349 = 135
# Arrows: up, left, right, down
328 = 111
331 = 113
333 = 114
336 = 116
# Insert, Delete, Home, End, PgUp, PgDn
338 = 118
339 = 119
327 = 110
335 = 115
329 = 112
337 = 117
# Keypad Enter, Keypad /, PrintScreen, NumLock, Pause
284 = 104
309 = 106
311 = 107
325 = 77
69 = 127
