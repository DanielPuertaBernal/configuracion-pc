# Spotify opens a new audio stream on every track change. Without this rule
# WirePlumber restores the last saved stream volume onto each new stream,
# which fights Spotify's own volume and makes it jump back to a stale value.
stream.rules = [
  {
    matches = [
      { application.name = "Spotify" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
      }
    }
  }
]
